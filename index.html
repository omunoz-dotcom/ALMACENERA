<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Dashboard Logístico - Agripac S.A.</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        :root {
            --blue-agripac: #1a237e;
            --red-agripac: #d32f2f;
            --white: #ffffff;
            --shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        body {
            font-family: 'Segoe UI', sans-serif;
            background-color: #f0f2f5;
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: auto;
            background: var(--white);
            padding: 20px;
            border-radius: 12px;
            box-shadow: var(--shadow);
        }

        header {
            text-align: center;
            border-bottom: 4px solid var(--blue-agripac);
            margin-bottom: 30px;
            padding-bottom: 10px;
        }

        header h1 { color: var(--blue-agripac); margin: 0; font-size: 24px; }
        header p { color: var(--red-agripac); font-weight: bold; margin: 5px 0; }

        /* Tabla Estilizada */
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        th {
            background-color: var(--blue-agripac);
            color: white;
            padding: 12px;
            font-size: 13px;
            text-transform: uppercase;
        }

        td {
            padding: 12px;
            border-bottom: 1px solid #eee;
            font-size: 14px;
            text-align: center;
        }

        .btn-qr {
            background-color: var(--blue-agripac);
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 5px;
            cursor: pointer;
            transition: 0.3s;
        }

        .btn-qr:hover { background-color: var(--red-agripac); }

        /* Modal del Pase de Ingreso */
        #modalPase {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: white;
            padding: 20px;
            border: 2px solid var(--blue-agripac);
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
            z-index: 1000;
            text-align: center;
            border-radius: 10px;
        }

        .ticket-header { border-bottom: 2px solid #eee; margin-bottom: 10px; }
        #qrcode { margin: 15px auto; display: flex; justify-content: center; }
        
        .overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.7);
            z-index: 999;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>AGRIPAC S.A.</h1>
        <p>CONTROL DE PLANIFICACIÓN DIARIA</p>
    </header>

    <table id="tablaPlanificacion">
        <thead>
            <tr>
                <th>ID Único</th>
                <th>Operador</th>
                <th>Conductor</th>
                <th>Placa</th>
                <th>Ruta</th>
                <th>Acción</th>
            </tr>
        </thead>
        <tbody>
            </tbody>
    </table>
</div>

<div class="overlay" id="overlay" onclick="cerrarPase()"></div>
<div id="modalPase">
    <div class="ticket-header">
        <h3 style="color: var(--blue-agripac); margin: 0;">PASE DE INGRESO</h3>
        <p id="pID" style="font-weight: bold; color: var(--red-agripac);"></p>
    </div>
    <div id="qrcode"></div>
    <div style="text-align: left; font-size: 13px;">
        <p><strong>Conductor:</strong> <span id="pChofer"></span></p>
        <p><strong>Placa:</strong> <span id="pPlaca"></span></p>
    </div>
    <button class="btn-qr" onclick="cerrarPase()">Cerrar</button>
</div>

<script>
    const csvUrl = "TU_ENLACE_CSV_AQUÍ";

    async function cargarDatos() {
        const response = await fetch(csvUrl);
        const data = await response.text();
        const rows = data.split('\n').slice(1);
        const tbody = document.querySelector("#tablaPlanificacion tbody");

        rows.forEach(row => {
            const cols = row.split(',');
            if (cols.length < 12) return;

            const [id, carga, descarga, , , , operador, chofer, placa, , , status] = cols;

            if (status.trim().toUpperCase() === "OK") {
                const tr = document.createElement("tr");
                tr.innerHTML = `
                    <td><strong>${id}</strong></td>
                    <td>${operador}</td>
                    <td>${chofer}</td>
                    <td>${placa}</td>
                    <td>${carga} > ${descarga}</td>
                    <td><button class="btn-qr" onclick="generarPase('${id}', '${chofer}', '${placa}')">Generar Pase</button></td>
                `;
                tbody.appendChild(tr);
            }
        });
    }

    let qrInstance = null;

    function generarPase(id, chofer, placa) {
        document.getElementById("pID").innerText = id;
        document.getElementById("pChofer").innerText = chofer;
        document.getElementById("pPlaca").innerText = placa;
        
        const qrContainer = document.getElementById("qrcode");
        qrContainer.innerHTML = ""; // Limpiar QR anterior
        
        new QRCode(qrContainer, {
            text: id,
            width: 150,
            height: 150
        });

        document.getElementById("modalPase").style.display = "block";
        document.getElementById("overlay").style.display = "block";
    }

    function cerrarPase() {
        document.getElementById("modalPase").style.display = "none";
        document.getElementById("overlay").style.display = "none";
    }

    cargarDatos();
</script>

</body>
</html>
