<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Logístico Agripac</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    
    <style>
        :root { --blue: #1a237e; --red: #d32f2f; --green: #25d366; --bg: #f0f2f5; }
        body { font-family: 'Segoe UI', sans-serif; background-color: var(--bg); margin: 0; padding: 20px; }

        .container { max-width: 1100px; margin: auto; background: white; padding: 30px; border-radius: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); }
        header { display: flex; justify-content: space-between; align-items: center; border-bottom: 4px solid var(--blue); padding-bottom: 20px; margin-bottom: 30px; }
        .logo h1 { color: var(--blue); margin: 0; font-size: 28px; }
        .logo p { color: var(--red); margin: 0; font-weight: bold; font-size: 14px; }

        /* Tabla */
        .table-container { overflow-x: auto; border-radius: 8px; border: 1px solid #ddd; }
        table { width: 100%; border-collapse: collapse; background: white; }
        th { background: var(--blue); color: white; padding: 15px; font-size: 12px; text-transform: uppercase; }
        td { padding: 12px; border-bottom: 1px solid #eee; font-size: 14px; text-align: center; }
        
        .btn-qr { background: var(--blue); color: white; border: none; padding: 10px 18px; border-radius: 6px; cursor: pointer; font-weight: 600; }

        /* Modal y Pase */
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 100; backdrop-filter: blur(5px); }
        .ticket-modal { display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 101; background: white; border-radius: 12px; width: 380px; overflow: hidden; }
        
        /* CONTENEDOR QR CON LOGO CENTRAL */
        #qrcode-wrapper { 
            position: relative; 
            display: inline-block; 
            margin: 20px auto; 
            background: white;
            padding: 10px;
            border: 1px solid #eee;
        }
        #qrcode { display: block; }
        
        /* Estilo del Logo dentro del QR */
        .qr-logo {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 45px; /* Tamaño ideal para no romper el escaneo */
            height: 45px;
            background: white;
            padding: 2px;
            border-radius: 4px;
        }

        .ticket-header { background: var(--blue); color: white; padding: 15px; text-align: center; }
        .details { text-align: left; padding: 20px; border-top: 2px dashed #ddd; font-size: 13px; }
        .actions { display: flex; flex-direction: column; gap: 10px; padding: 20px; background: #f9f9f9; }
        
        .btn-ws { background: var(--green); color: white; border: none; padding: 14px; border-radius: 8px; font-weight: bold; cursor: pointer; }
        .btn-dl { background: var(--blue); color: white; border: none; padding: 12px; border-radius: 8px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

<div class="container">
    <header>
        <div class="logo">
            <h1>AGRIPAC S.A.</h1>
            <p>SISTEMA DE GESTIÓN LOGÍSTICA</p>
        </div>
        <div style="text-align: right; font-size: 12px;">
            <strong>Dashboard de Trazabilidad</strong><br>
            <span id="current-date"></span>
        </div>
    </header>

    <div id="loading" style="text-align:center; padding:20px;">Sincronizando con Google Sheets...</div>

    <div class="table-container" id="wrapper" style="display:none;">
        <table>
            <thead>
                <tr>
                    <th>Conductor</th>
                    <th>Placa</th>
                    <th>Origen / Destino</th>
                    <th>Acción</th>
                </tr>
            </thead>
            <tbody id="table-body"></tbody>
        </table>
    </div>
</div>

<div class="modal-overlay" id="overlay" onclick="closeTicket()"></div>
<div class="ticket-modal" id="ticket-modal">
    <div id="capture-area" style="background: white; text-align: center;">
        <div class="ticket-header">
            <h3 style="margin:0">PASE DE INGRESO ÚNICO</h3>
            <small>AGRIPAC S.A. - SEGURIDAD PLANTA</small>
        </div>

        <div id="qrcode-wrapper">
            <div id="qrcode"></div>
            <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRgdU9ENZe0xEEBIekcna9hIY1LQynypXsvGw&s" class="qr-logo">
        </div>

        <div class="details">
            <p><strong>ID:</strong> <span id="t-id"></span></p>
            <p><strong>CONDUCTOR:</strong> <span id="t-chofer"></span></p>
            <p><strong>PLACA:</strong> <span id="t-placa"></span></p>
            <p style="text-align: center; color: var(--red); font-weight: bold; margin-top: 15px;">MUESTRE ESTE QR EN GARITA</p>
        </div>
    </div>
    
    <div class="actions">
        <button class="btn-ws" onclick="enviarWhatsApp()">🟢 Enviar a WhatsApp</button>
        <button class="btn-dl" onclick="downloadTicket()">💾 Descargar Imagen</button>
        <button onclick="closeTicket()" style="border:none; background:none; cursor:pointer; color:#777;">Cerrar</button>
    </div>
</div>

<script>
    const CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQIIx21a0sA1DmXaVSt9kkq0p6H-ptdOiMBLF69kPQS7RMnQELm8XObYvp3nlr1kdm9ef7ZxlqHHO6-/pub?gid=0&single=true&output=csv";

    document.getElementById('current-date').innerText = new Date().toLocaleDateString();

    async function fetchData() {
        try {
            const response = await fetch(CSV_URL);
            const data = await response.text();
            const rows = data.split('\n').map(row => row.split(','));
            const tbody = document.getElementById('table-body');
            tbody.innerHTML = '';

            rows.slice(1).forEach(cols => {
                if (cols.length < 12) return;
                const [id, carga, descarga, , , , , chofer, placa, , , status] = cols;

                if (status && status.trim().toUpperCase() === "OK") {
                    const tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td><strong>${chofer}</strong></td>
                        <td>${placa}</td>
                        <td>${carga} > ${descarga}</td>
                        <td><button class="btn-qr" onclick="openTicket('${id}', '${chofer}', '${placa}')">Generar Pase</button></td>
                    `;
                    tbody.appendChild(tr);
                }
            });
            document.getElementById('loading').style.display = 'none';
            document.getElementById('wrapper').style.display = 'block';
        } catch (e) { console.error(e); }
    }

    function openTicket(id, chofer, placa) {
        document.getElementById('t-id').innerText = id;
        document.getElementById('t-chofer').innerText = chofer;
        document.getElementById('t-placa').innerText = placa;

        const qrBox = document.getElementById('qrcode');
        qrBox.innerHTML = '';
        // Generamos el QR con nivel de corrección 'H' (High) para soportar el logo central
        new QRCode(qrBox, { 
            text: id, 
            width: 220, 
            height: 220, 
            colorDark: "#000000",
            correctLevel : QRCode.CorrectLevel.H 
        });

        document.getElementById('overlay').style.display = 'block';
        document.getElementById('ticket-modal').style.display = 'block';
    }

    function closeTicket() {
        document.getElementById('overlay').style.display = 'none';
        document.getElementById('ticket-modal').style.display = 'none';
    }

    function downloadTicket() {
        const area = document.getElementById('capture-area');
        html2canvas(area, { useCORS: true }).then(canvas => {
            const link = document.createElement('a');
            link.download = `PASE_${document.getElementById('t-placa').innerText}.png`;
            link.href = canvas.toDataURL();
            link.click();
        });
    }

    function enviarWhatsApp() {
        const area = document.getElementById('capture-area');
        html2canvas(area, { useCORS: true }).then(canvas => {
            canvas.toBlob(blob => {
                const item = new ClipboardItem({ "image/png": blob });
                navigator.clipboard.write([item]).then(() => {
                    const msg = encodeURIComponent(`*AGRIPAC - PASE DE INGRESO*\n\nAdjunto pase para la placa ${document.getElementById('t-placa').innerText}.\n\n_Pega la imagen en este chat._`);
                    window.open(`https://wa.me/?text=${msg}`, '_blank');
                    alert("Imagen copiada. Pégala en el chat de WhatsApp.");
                });
            });
        });
    }

    fetchData();
    setInterval(fetchData, 40000);
</script>

</body>
</html>
