<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AGRIPAC - Sistema Logístico Integral</title>
    
    <script src="https://unpkg.com/html5-qrcode"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    
    <style>
        :root { --blue: #1a237e; --red: #d32f2f; --green: #2e7d32; --bg: #f0f2f5; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); margin: 0; padding-bottom: 50px; }
        
        nav { background: var(--blue); padding: 10px; display: flex; gap: 10px; overflow-x: auto; position: sticky; top: 0; z-index: 1000; }
        nav button { background: rgba(255,255,255,0.1); color: white; border: 1px solid rgba(255,255,255,0.3); padding: 10px 15px; border-radius: 8px; cursor: pointer; }
        nav button.active { background: white; color: var(--blue); font-weight: bold; }

        .container { max-width: 1000px; margin: 20px auto; padding: 0 15px; }
        .card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); margin-bottom: 20px; }
        
        /* Módulos */
        .modulo { display: none; }
        .modulo.active { display: block; }

        /* Tabla de Planificación */
        .table-res { overflow-x: auto; margin-top: 10px; }
        table { width: 100%; border-collapse: collapse; font-size: 13px; }
        th { background: var(--blue); color: white; padding: 10px; }
        td { padding: 10px; border-bottom: 1px solid #eee; text-align: center; }

        /* Scanner */
        #reader { width: 100%; max-width: 400px; margin: 10px auto; border: 2px solid #ddd; display: none; }
        
        /* Botones */
        .btn { width: 100%; padding: 12px; border: none; border-radius: 6px; color: white; font-weight: bold; cursor: pointer; margin-top: 10px; }
        .btn-blue { background: var(--blue); }
        .btn-green { background: var(--green); }
        .btn-red { background: var(--red); }
        .btn-scan { background: #546e7a; margin-bottom: 15px; }

        input, select { width: 100%; padding: 10px; margin-top: 5px; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; }
    </style>
</head>
<body>

<nav>
    <button onclick="switchTab('tab-planif')" id="btn-tab-planif" class="active">📋 Planificación</button>
    <button onclick="switchTab('tab-garita')">👮 Garita</button>
    <button onclick="switchTab('tab-bascula')">⚖️ Báscula</button>
    <button onclick="switchTab('tab-despacho')">🚛 Despacho</button>
</nav>

<div class="container">

    <div id="tab-planif" class="modulo active">
        <div class="card">
            <h2>Planificación del Día</h2>
            <div class="table-res">
                <table>
                    <thead>
                        <tr>
                            <th>Conductor</th>
                            <th>Placa</th>
                            <th>Ruta</th>
                            <th>Estado</th>
                            <th>Acción</th>
                        </tr>
                    </thead>
                    <tbody id="table-body">
                        <tr><td colspan="5">Cargando datos de Agripac...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <div id="tab-garita" class="modulo">
        <div class="card">
            <h2>Módulo Garita</h2>
            <button class="btn btn-scan" id="btn-start-scan" onclick="toggleScanner()">📷 Activar Escáner QR</button>
            <div id="reader"></div>
            
            <label>ID Detectado:</label>
            <input type="text" id="id-input" placeholder="Escanee o ingrese ID manualmente">
            
            <button class="btn btn-blue" onclick="registrarSAP('GARITA', 'ENTRADA')">Validar Ingreso</button>
            <button class="btn btn-red" onclick="registrarSAP('GARITA', 'SALIDA')">Salida Final</button>
        </div>
    </div>

    <div id="tab-bascula" class="modulo">
        <div class="card">
            <h2>Báscula de Pesaje</h2>
            <label>Peso (KG):</label>
            <input type="number" id="peso-input" placeholder="0.00">
            <button class="btn btn-green" onclick="registrarSAP('BASCULA', 'PESO_IN')">Registrar Peso Inicial</button>
            <button class="btn btn-blue" onclick="registrarSAP('BASCULA', 'PESO_OUT')">Registrar Peso Final</button>
        </div>
    </div>

    <div id="tab-despacho" class="modulo">
        <div class="card">
            <h2>Despacho y Andenes</h2>
            <label>Seleccionar Andén:</label>
            <select id="anden-select">
                <option value="ANDEN 1">Andén 1</option>
                <option value="ANDEN 2">Andén 2</option>
                <option value="ANDEN 3">Andén 3</option>
            </select>
            <button class="btn btn-blue" onclick="notificarAndenWA()">Asignar y Notificar WA</button>
        </div>
    </div>

</div>

<script>
    const CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQIIx21a0sA1DmXaVSt9kkq0p6H-ptdOiMBLF69kPQS7RMnQELm8XObYvp3nlr1kdm9ef7ZxlqHHO6-/pub?gid=0&single=true&output=csv";
    let html5QrCode;

    // 1. CARGAR PLANIFICACIÓN
    async function fetchPlanif() {
        const res = await fetch(CSV_URL);
        const csv = await res.text();
        const rows = csv.split('\n').slice(1);
        const tbody = document.getElementById('table-body');
        tbody.innerHTML = '';

        rows.forEach(row => {
            const col = row.split(',');
            if (col.length < 12) return;
            const [id, carga, descarga, , , , , chofer, placa, , , status] = col;

            if (status.trim().toUpperCase() === "OK") {
                tbody.innerHTML += `<tr>
                    <td>${chofer}</td>
                    <td>${placa}</td>
                    <td>${carga} > ${descarga}</td>
                    <td><small>Pendiente</small></td>
                    <td><button onclick="copiarID('${id}')" style="font-size:10px">Usar</button></td>
                </tr>`;
            }
        });
    }

    function copiarID(id) {
        document.getElementById('id-input').value = id;
        alert("ID cargado para procesar: " + id);
    }

    // 2. CONTROL DEL ESCÁNER (MANUAL)
    function toggleScanner() {
        const reader = document.getElementById('reader');
        if (!html5QrCode) {
            reader.style.display = 'block';
            html5QrCode = new Html5Qrcode("reader");
            html5QrCode.start({ facingMode: "environment" }, { fps: 10, qrbox: 250 }, 
                (text) => {
                    document.getElementById('id-input').value = text;
                    stopScanner();
                    alert("QR Detectado: " + text);
                }
            );
            document.getElementById('btn-start-scan').innerText = "❌ Apagar Cámara";
        } else {
            stopScanner();
        }
    }

    function stopScanner() {
        if (html5QrCode) {
            html5QrCode.stop().then(() => {
                html5QrCode = null;
                document.getElementById('reader').style.display = 'none';
                document.getElementById('btn-start-scan').innerText = "📷 Activar Escáner QR";
            });
        }
    }

    // 3. NAVEGACIÓN
    function switchTab(tabId) {
        document.querySelectorAll('.modulo').forEach(m => m.classList.remove('active'));
        document.getElementById(tabId).classList.add('active');
        document.querySelectorAll('nav button').forEach(b => b.classList.remove('active'));
        event.currentTarget.classList.add('active');
        if (tabId !== 'tab-garita') stopScanner();
    }

    // 4. REGISTRO SAP (SIMULADO)
    function registrarSAP(modulo, evento) {
        const id = document.getElementById('id-input').value;
        const peso = document.getElementById('peso-input').value;
        if(!id) return alert("Error: No hay un ID de camión seleccionado.");
        
        const log = { id, modulo, evento, fecha: new Date().toLocaleString(), detalle: peso || "N/A" };
        console.log("MOVIMIENTO SAP REGISTRADO:", log);
        alert(`REGISTRO EXITOSO EN HOJA MOVIMIENTOS\nMódulo: ${modulo}\nEvento: ${evento}`);
    }

    function notificarAndenWA() {
        const anden = document.getElementById('anden-select').value;
        const msg = encodeURIComponent(`*AGRIPAC LOGÍSTICA*\n\nSu unidad ha sido autorizada.\nProceda al *${anden}* para carga.`);
        window.open(`https://wa.me/?text=${msg}`, '_blank');
    }

    fetchPlanif();
    setInterval(fetchPlanif, 60000); // Actualiza cada minuto
</script>

</body>
</html>
